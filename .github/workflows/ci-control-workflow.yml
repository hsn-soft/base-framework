name: 'CI Control Workflow'

# The same steps run on a developer's machine with scripts/ci-detector/ (ci_detector_mac.sh, ci_detector_win.ps1): keep them in step.
#
# The jobs are a pipeline, one after the other (ADR-0109): the rules, the format and the build first; then the unit tests, then the integration tests, on what was built;
# then the coverage gate; then the summary, which runs whatever happened before and **fails when any job did not succeed**.
# One after the other because the minutes of the runners are limited: a failure stops the jobs that would have been paid for after it.
#   rules-format-build -> unit-tests -> integration-tests -> coverage-gate -> summary
# The first job restores and builds once; the next ones take what it built and only run their tests.
# Only "CI Summary JOB" has to be a required check: a job skipped because one before it failed counts as passed for the protection of a branch, the summary does not.

# When it runs (ADR-0113): on every pull request into dev, on Mondays at 03:00 UTC on dev (what the README badge shows, and what catches what changes with no push: an image that disappears, a package with a new advisory),
# and by hand ("Run workflow", on dev). Not on a push to dev: dev only takes code through a pull request, whose run is the one that counts (the branch protection requires dev to be up to date before a merge).
on:
    pull_request:
        branches: [ "dev" ]
        types: [ opened, synchronize, reopened ]
    schedule:
        - cron: '0 3 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # Only supersede PR runs (a newer push to the pull request); a scheduled or a manual run on dev always finishes and reports
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    # Raise this as coverage grows; the PR fails when line coverage of src drops below it.
    COVERAGE_THRESHOLD: '99'

jobs:
    rules-format-build:
        name: 'CI Rules, Format And Build JOB'
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v5
                with:
                    fetch-depth: 0

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: '10.0.x'

            -   name: Cache NuGet
                uses: actions/cache@v5
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'common.props', 'common.test.props', 'common.versions.props') }}
                    restore-keys: |
                        ${{ runner.os }}-nuget

            # The rules of the repository: every package has unit tests, the references of the project files are in order and follow the rules of the framework.
            -   name: Repository Rules
                run: >
                    ./scripts/ci-detector/ci-timed.sh timings/rules-build.txt "Repository rules" bash -ec '
                    ./scripts/ci-detector/ci-check-test-project-exist.sh;
                    python3 scripts/ci-detector/ci-force-csproj-order.py;
                    python3 scripts/ci-detector/ci-force-framework-references-rules.py'

            -   name: Restore Dependencies
                run: ./scripts/ci-detector/ci-timed.sh timings/rules-build.txt "Restore" dotnet restore --verbosity minimal --configfile NuGet.Config

            # The same rules the pre-commit hook fixes; this catches commits made without the hook (--no-verify, a missing install).
            -   name: Format Check (C#)
                run: >
                    ./scripts/ci-detector/ci-timed.sh timings/rules-build.txt "Format check (C#)" bash -ec '
                    dotnet format whitespace HsnSoft.Base.sln --verify-no-changes --no-restore;
                    dotnet format style HsnSoft.Base.sln --verify-no-changes --severity info --no-restore'

            -   name: Format Check (JSON)
                run: ./scripts/ci-detector/ci-timed.sh timings/rules-build.txt "Format check (JSON)" dotnet run scripts/ci-detector/format-json.cs -- --all --check

            # Warnings are errors: a build with a warning ends the pipeline here.
            -   name: Build Solution
                run: ./scripts/ci-detector/ci-timed.sh timings/rules-build.txt "Build" dotnet build --no-restore --verbosity minimal --configuration Release -p:TreatWarningsAsErrors=true

            # What the next jobs run on: the build output of the test projects (which hold copies of what they reference, so the bin of the libraries is not needed) and the restore state of every
            # project, in one file (thousands of small files are slow to upload one by one), compressed with zstd (a third of the time of gzip, and smaller).
            -   name: Pack The Build
                run: ./scripts/ci-detector/ci-timed.sh timings/rules-build.txt "Pack the build" tar -I 'zstd -3 -T0' -cf build-output.tar.zst src/*/obj test/*/bin/Release test/*/obj

            -   name: Upload The Build
                uses: actions/upload-artifact@v6
                with:
                    name: build-output
                    path: build-output.tar.zst
                    retention-days: 1
                    compression-level: 0

            -   name: Upload Timings
                if: always()
                uses: actions/upload-artifact@v6
                with:
                    name: rules-build-timings
                    path: timings
                    if-no-files-found: ignore

    unit-tests:
        name: 'CI Check Unit Test JOB'
        runs-on: ubuntu-latest
        needs: [ rules-format-build ]

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v5

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: '10.0.x'

            -   name: Cache NuGet
                uses: actions/cache@v5
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'common.props', 'common.test.props', 'common.versions.props') }}
                    restore-keys: |
                        ${{ runner.os }}-nuget

            -   name: Download The Build
                uses: actions/download-artifact@v7
                with:
                    name: build-output

            # No second build: what the first job built is put back where it was, and the packages come from the cache (restore only checks them).
            -   name: Unpack The Build
                run: ./scripts/ci-detector/ci-timed.sh timings/unit.txt "Unpack the build" bash -ec 'tar -I zstd -xf build-output.tar.zst && dotnet restore --verbosity minimal --configfile NuGet.Config'

            -   name: Unit Tests With Coverage
                run: >
                    ./scripts/ci-detector/ci-timed.sh timings/unit.txt "Unit tests"
                    ./scripts/run-tests.sh unit
                    --no-restore --no-build --configuration Release --verbosity minimal
                    --settings test/coverlet.runsettings
                    --collect:"XPlat Code Coverage"
                    --results-directory ./TestResults/unit
                    --logger "trx;LogFilePrefix=unit"
                    --logger "console;verbosity=normal"

            -   name: Upload Test Results
                if: always()
                uses: actions/upload-artifact@v6
                with:
                    name: unit-test-results
                    path: TestResults/unit

            -   name: Upload Timings
                if: always()
                uses: actions/upload-artifact@v6
                with:
                    name: unit-timings
                    path: timings
                    if-no-files-found: ignore

    integration-tests:
        name: 'CI Check Integration Test JOB'
        runs-on: ubuntu-latest   # Docker is available; Testcontainers starts the services the tests need.
        needs: [ unit-tests ]

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v5

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: '10.0.x'

            -   name: Cache NuGet
                uses: actions/cache@v5
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'common.props', 'common.test.props', 'common.versions.props') }}
                    restore-keys: |
                        ${{ runner.os }}-nuget

            -   name: Download The Build
                uses: actions/download-artifact@v7
                with:
                    name: build-output

            -   name: Unpack The Build
                run: ./scripts/ci-detector/ci-timed.sh timings/integration.txt "Unpack the build" bash -ec 'tar -I zstd -xf build-output.tar.zst && dotnet restore --verbosity minimal --configfile NuGet.Config'

            -   name: Integration Tests With Coverage
                run: >
                    ./scripts/ci-detector/ci-timed.sh timings/integration.txt "Integration tests"
                    ./scripts/run-tests.sh integration
                    --no-restore --no-build --configuration Release --verbosity minimal
                    --settings test/coverlet.runsettings
                    --collect:"XPlat Code Coverage"
                    --logger "trx;LogFilePrefix=integration"
                    --logger "console;verbosity=normal"
                    --results-directory ./TestResults/integration

            -   name: Upload Test Results
                if: always()
                uses: actions/upload-artifact@v6
                with:
                    name: integration-test-results
                    path: TestResults/integration
                    if-no-files-found: ignore

            -   name: Upload Timings
                if: always()
                uses: actions/upload-artifact@v6
                with:
                    name: integration-timings
                    path: timings
                    if-no-files-found: ignore

    coverage-gate:
        name: 'CI Coverage Gate JOB'
        runs-on: ubuntu-latest
        needs: [ integration-tests ]

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v5

            -   name: Download Test Results
                uses: actions/download-artifact@v7
                with:
                    pattern: '*-test-results'
                    path: TestResults

            # A line counts as covered when the unit or the integration tests ran it (the broker/database code is only reachable with the real service).
            -   name: Coverage Gate
                run: python3 scripts/ci-detector/ci-check-coverage.py "$COVERAGE_THRESHOLD" $(find TestResults -name 'coverage.cobertura.xml')

    # The times of every step, the test counts and the coverage on one page, whether the run passed or not.
    summary:
        name: 'CI Summary JOB'
        runs-on: ubuntu-latest
        needs: [ rules-format-build, unit-tests, integration-tests, coverage-gate ]
        if: ${{ !cancelled() }}   # a run that a newer push cancelled does not report
        permissions:
            contents: write           # only to publish the badges to their own branch (ADR-0114); the step that does it never runs for a pull request

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v5

            -   name: Download Results And Timings
                uses: actions/download-artifact@v7
                with:
                    pattern: '*-{test-results,timings}'
                    path: summary-input

            # The numbers of the README badges, from what this run did. The result of the pipeline is known only from the jobs before this one.
            -   name: Summary
                env:
                    PIPELINE_RESULT: ${{ (needs.rules-format-build.result == 'success' && needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success' && needs.coverage-gate.result == 'success') && 'success' || 'failure' }}
                run: python3 scripts/ci-detector/ci-summary.py summary-input summary-input --badges badges --result "$PIPELINE_RESULT"

            # Only a scheduled or a manual run on dev makes the badges: a pull request must not change what the README says of dev.
            -   name: Publish The Badges
                if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' }}
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: ./scripts/ci-detector/ci-publish-badges.sh badges

            # The result of the pipeline: any job that did not succeed (failed, or skipped because one before it failed) fails this one, which is the only job a branch has to require.
            -   name: Result Of The Pipeline
                if: ${{ !cancelled() }}
                env:
                    RESULTS: ${{ join(needs.*.result, ' ') }}
                run: |
                    echo "Results of the jobs: $RESULTS"
                    for result in $RESULTS; do
                        if [ "$result" != "success" ]; then
                            echo "::error::A job of the pipeline did not succeed ($RESULTS)."
                            exit 1
                        fi
                    done
