name: 'CI Branch Rule'

# Which branch may be merged into which (ADR-0144). GitHub cannot limit the source of a merge by itself, so every pull request, into any branch, runs this check, and the protection of each branch requires it.
# 1. The source must be dev, master, feat/*, bugfix/*, hotfix/* or rel/*; any other name cannot be merged.
# 2. Into dev or master: from feat/*, bugfix/*, hotfix/* or rel/*.
# 3. Into a release branch (rel/*): from bugfix/*, hotfix/* or rel/*.
# 4. The specific release branches (the flow of the repository) have rules of their own, which replace rule 3:
#      rel/nuget-candidate  only from dev, master
#      rel/nuget-regular    only from dev, master, rel/nuget-candidate
# Another branch (not dev, master or rel/*) takes any source of a known name.

on:
  pull_request:
    types: [ opened, reopened, synchronize, edited ]

permissions:
  contents: read

jobs:
  rule:
    name: 'CI Branch Rule JOB'
    runs-on: ubuntu-latest

    steps:
      # the names of the branches reach the script as environment variables, never inside the text of it: a branch name is written by whoever opens the pull request
      - name: The Source Of The Pull Request
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$HEAD_REPOSITORY" = "$REPOSITORY" ] || fail "The pull request comes from another repository ($HEAD_REPOSITORY)."
          [[ "$HEAD" =~ ^(dev|master|feat/.+|bugfix/.+|hotfix/.+|rel/.+)$ ]] || fail "The source branch '$HEAD' has no known name: only dev, master, feat/*, bugfix/*, hotfix/* and rel/* may be the source of a pull request."
          case "$BASE" in
            dev|master)
              [[ "$HEAD" =~ ^(feat|bugfix|hotfix|rel)/.+ ]] || fail "Into $BASE only from feat/*, bugfix/*, hotfix/* or rel/* (this one is from '$HEAD')." ;;
            rel/nuget-candidate)
              [[ "$HEAD" =~ ^(dev|master)$ ]] || fail "Into rel/nuget-candidate only from dev, master (this one is from '$HEAD')." ;;
            rel/nuget-regular)
              [[ "$HEAD" =~ ^(dev|master|rel/nuget-candidate)$ ]] || fail "Into rel/nuget-regular only from dev, master, rel/nuget-candidate (this one is from '$HEAD')." ;;
            rel/*)
              extra=""
              case "$BASE" in
                *) ;;
              esac
              [[ "$HEAD" =~ ^((bugfix|hotfix|rel)/.+$extra)$ ]] || fail "Into the release branch $BASE only from bugfix/*, hotfix/* or rel/*${extra:+ (also ${extra#|})} (this one is from '$HEAD')." ;;
          esac
          echo "'$HEAD' into '$BASE': allowed."
