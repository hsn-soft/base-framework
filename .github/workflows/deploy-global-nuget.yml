name: 'Deploy Global NuGet'

on:
  push:
    branches:
      - rel/nuget

env:
  PACKAGE_OUTPUT_DIRECTORY: ${{ github.workspace }}/output
  GLOBAL_NUGET_SOURCE_URL: 'https://api.nuget.org/v3/index.json'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 'Global NuGet Deploy JOB'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache Search
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'common.props', 'common.test.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget

      - name: Restore Dependencies
        run: dotnet restore --force --verbosity minimal --configfile NuGet.Config

      - name: Build Solution
        run: dotnet build --no-restore --no-incremental --verbosity minimal --configuration Release

      - name: Unit Tests
        run: ./scripts/run-tests.sh unit --no-restore --no-build --verbosity minimal --configuration Release

      - name: Pack Solution
        run: dotnet pack --no-restore --no-build --configuration Release --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }}

      - name: Push Packages
        run: dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.nupkg --skip-duplicate -k ${{ secrets.GLOBAL_NUGET_TOKEN }} -s ${{ env.GLOBAL_NUGET_SOURCE_URL }}
