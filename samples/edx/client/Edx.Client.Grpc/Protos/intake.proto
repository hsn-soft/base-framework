syntax = "proto3";

option csharp_namespace = "Edx.Client.Grpc";

package edx.intake.v1;

// What a customer sends through gRPC: the same things as the REST and the WCF endpoints, answered with the queue item of the invoice.
// Every call needs the JWT bearer token in the "authorization" metadata. The answer says the invoice was queued; what became of it is in the queue (the REST endpoints of the queue).
service Intake {
  // A zip with one file, as a stream: the first message is the header (the invoice, the hash of the zip, the type of the file), the next ones carry the bytes of the zip.
  rpc UploadInvoiceFile (stream UploadChunk) returns (QueueReply);

  // The model of an invoice; the service keeps it as a JSON or an XML file.
  rpc SubmitInvoice (SubmitInvoiceRequest) returns (QueueReply);
}

// The type of the file in the zip (the numbers are the ones of InvoiceSourceType).
enum SourceType {
  SOURCE_TYPE_UNSPECIFIED = 0;
  SOURCE_TYPE_XML = 2;
  SOURCE_TYPE_TXT = 3;
  SOURCE_TYPE_CSV = 4;
  SOURCE_TYPE_XLS = 5;
}

message UploadHeader {
  string file_name = 1;      // the name of the zip
  string invoice_id = 2;     // the uuid of the invoice
  string invoice_number = 3;
  string file_hash = 4;      // the SHA-256 of the zip, in hex
  SourceType source_type = 5;
}

message UploadChunk {
  oneof payload {
    UploadHeader header = 1;
    bytes data = 2;
  }
}

enum ModelFormat {
  MODEL_FORMAT_JSON = 0;
  MODEL_FORMAT_XML = 1;
}

message SubmitInvoiceRequest {
  InvoiceSubmission invoice = 1;
  ModelFormat format = 2;
}

// Decimals and dates are text (a decimal with a dot, a date as yyyy-MM-dd), so no precision is lost on the way.
message InvoiceSubmission {
  string invoice_number = 1;
  string issue_date = 2;
  string currency = 3;
  string supplier_name = 4;
  string supplier_tax_id = 5;
  string customer_name = 6;
  string customer_tax_id = 7;
  repeated InvoiceLine lines = 8;
  string invoice_id = 9;     // the uuid of the invoice
}

message InvoiceLine {
  string description = 1;
  string quantity = 2;
  string unit_price = 3;
  string vat_rate = 4;
}

message QueueReply {
  string queue_id = 1;
  string invoice_id = 2;
  string invoice_number = 3;
  string source_type = 4;
  string channel_type = 5;
  string status = 6;
  string file_name = 7;
  string file_hash = 8;
  int64 size_bytes = 9;
  string tenant_id = 10;
}
