# The back office is a single page application: a path that is not a file is the page, and the router of Angular decides. The probes of the platform ask /health/*.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /health/ {
        default_type application/json;
        return 200 '{"status":"Healthy"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # the files of a build have the hash of their content in their names
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
