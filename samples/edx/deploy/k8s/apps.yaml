# The hosts of the Edx system in an environment of the cluster (uat, production): deploy.sh puts the environment into the words between double underscores and applies it.
#  - Two pods of each host. The infrastructure is the one on this machine (host.docker.internal), except Kafka, which has a broker for each environment (uat: host.docker.internal:9192, production: 9292):
#    an environment is told apart by its databases (Edx_*_Uat, Edx_*_Prod), the prefix of its Redis keys, the buckets of MinIO and its broker (see appsettings.<environment>.json).
#  - The settings of a host are the secret settings-<host> (appsettings.<environment>.json with the secrets put in, mounted over the file of the image). The back office has none: its build has the addresses.
#  - The three probes of the health endpoints (docs/Health.md): the startup probe gives a start up to 3 minutes, the readiness probe takes a pod that cannot reach a dependency out of the traffic, the liveness
#    probe asks only the process; the timeout of a probe is longer than Health:CheckTimeout (5 s). The gRPC host answers its probes on its own HTTP/1 port, 8081 (its port 8080 is HTTP/2 only).
#  - A stop that waits: Hosting:ShutdownTimeoutSeconds (30) + EventBus:ShutdownTimeout (30) + the preStop, so terminationGracePeriodSeconds is 80; a pod is replaced one at a time (maxUnavailable 0).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  labels: { app: identity-service }
spec:
  replicas: __REPLICAS__
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: identity-service }
  template:
    metadata:
      labels: { app: identity-service }
    spec:
      terminationGracePeriodSeconds: 80
      containers:
        - name: host
          image: edx/identity-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: __ENVIRONMENT__
          volumeMounts:
            - { name: settings, mountPath: /app/appsettings.__ENVIRONMENT__.json, subPath: appsettings.__ENVIRONMENT__.json, readOnly: true }
          startupProbe:
            httpGet: { path: /health/startup, port: 8080 }
            periodSeconds: 3
            timeoutSeconds: 7
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 7
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: settings
          secret: { secretName: settings-identity-service }
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
spec:
  selector: { app: identity-service }
  ports:
    - port: 8080
      targetPort: 8080
---
