syntax = "proto3";

option csharp_namespace = "Edx.Integration.FirmInvoice.Grpc.Host";

package edx.firm_invoice.v1;

// What a customer sends through gRPC: the same things as the REST and the WCF endpoints, answered with the queue item of the invoice.
// Every call needs the JWT bearer token in the "authorization" metadata. The answer says the invoice was queued; what became of it is in the queue (the REST endpoints of the queue).
service FirmInvoiceService {
  // A zip with one file, as a stream: the first message is the header (the invoice, the hash of the zip, the type of the file), the next ones carry the bytes of the zip.
  rpc UploadInvoiceFile (stream UploadChunk) returns (QueueReply);

  // The model of an invoice; the service keeps it as a JSON or an XML file.
  rpc SubmitInvoice (SubmitInvoiceRequest) returns (QueueReply);
}

// The type of the file in the zip (the numbers are the ones of InvoiceSourceType).
enum SourceType {
  SOURCE_TYPE_UNSPECIFIED = 0;
  SOURCE_TYPE_XML = 2;
  SOURCE_TYPE_TXT = 3;
  SOURCE_TYPE_CSV = 4;
  SOURCE_TYPE_XLS = 5;
}

message UploadHeader {
  string file_name = 1;      // the name of the zip
  string invoice_id = 2;     // the uuid of the invoice
  string invoice_number = 3;
  string file_hash = 4;      // the SHA-256 of the zip, in hex
  SourceType source_type = 5;
}

message UploadChunk {
  oneof payload {
    UploadHeader header = 1;
    bytes data = 2;
  }
}

enum ModelFormat {
  MODEL_FORMAT_JSON = 0;
  MODEL_FORMAT_XML = 1;
}

message SubmitInvoiceRequest {
  InvoiceSubmission invoice = 1;
  ModelFormat format = 2;
}

// Decimals and dates are text (a decimal with a dot, a date as yyyy-MM-dd), so no precision is lost on the way. The supplier is not here: an invoice is issued by the tenant that sends it.
message InvoiceSubmission {
  string invoice_id = 1;     // the uuid of the invoice (its ETTN)
  string invoice_number = 2; // 16 characters: three letters or digits, the year, nine digits (ABC2026000000001)
  string issue_date = 3;
  string currency = 4;       // TRY
  string customer_name = 5;
  string customer_tax_id = 6;     // the VKN (10 digits) or the TCKN (11)
  string customer_tax_office = 7; // optional
  string customer_district = 8;
  string customer_city = 9;
  string customer_country = 10;   // optional: Türkiye
  repeated InvoiceLine lines = 11;
  string invoice_profile = 12;    // optional: TEMELFATURA (the default) or TICARIFATURA (the receiver answers it)
}

message InvoiceLine {
  string description = 1;
  string quantity = 2;
  string unit_code = 3;      // optional: C62 (a piece)
  string unit_price = 4;     // without VAT
  string vat_rate = 5;       // in percent
}

message QueueReply {
  string queue_id = 1;
  string invoice_id = 2;
  string invoice_number = 3;
  string source_type = 4;
  string channel_type = 5;
  string status = 6;
  string file_name = 7;
  string file_hash = 8;
  int64 size_bytes = 9;
  string tenant_id = 10;
}
