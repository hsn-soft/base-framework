syntax = "proto3";

option csharp_namespace = "Edx.IntakeService.Http.Host.GrpcApi";

package edx.intake.v1;

// What a customer sends through gRPC: the same three things as the REST and the WCF endpoints, answered with the record of the file.
// Every call needs the JWT bearer token in the "authorization" metadata.
service Intake {
  // A zip of XML files, as a stream: the first message names the file, the next ones carry its bytes.
  rpc UploadXmlArchive (stream UploadChunk) returns (StoredFileReply);

  // A zip of text, CSV or Excel files, in the same way.
  rpc UploadTabularArchive (stream UploadChunk) returns (StoredFileReply);

  // A model of the shared API; the service keeps it as a JSON or an XML file.
  rpc SubmitInvoice (SubmitInvoiceRequest) returns (StoredFileReply);
}

message UploadChunk {
  oneof payload {
    string file_name = 1;
    bytes data = 2;
  }
}

enum ModelFormat {
  MODEL_FORMAT_JSON = 0;
  MODEL_FORMAT_XML = 1;
}

message SubmitInvoiceRequest {
  InvoiceSubmission invoice = 1;
  ModelFormat format = 2;
}

// Decimals and dates are text (a decimal with a dot, a date as yyyy-MM-dd), so no precision is lost on the way.
message InvoiceSubmission {
  string invoice_number = 1;
  string issue_date = 2;
  string currency = 3;
  string supplier_name = 4;
  string supplier_tax_id = 5;
  string customer_name = 6;
  string customer_tax_id = 7;
  repeated InvoiceLine lines = 8;
}

message InvoiceLine {
  string description = 1;
  string quantity = 2;
  string unit_price = 3;
  string vat_rate = 4;
}

message StoredFileReply {
  string id = 1;
  string kind = 2;
  string channel = 3;
  string file_name = 4;
  string content_type = 5;
  int64 size_bytes = 6;
  string folder_path = 7;
  string container = 8;
  string object_name = 9;
  int32 entry_count = 10;
  string tenant_id = 11;
}
