            periodSeconds: 3
            timeoutSeconds: 7
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 7
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: settings
          secret: { secretName: settings-auth-server-service }
        - name: private-key
          secret: { secretName: abc-auth-private-key }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-server-service
spec:
  selector: { app: auth-server-service }
  ports:
    - port: 8080
      targetPort: 8080
