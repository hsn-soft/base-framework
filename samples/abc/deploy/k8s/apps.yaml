            - { name: settings, mountPath: /app/appsettings.__ENVIRONMENT__.json, subPath: appsettings.__ENVIRONMENT__.json, readOnly: true }
            - { name: private-key, mountPath: /app/private_key.xml, subPath: private_key.xml, readOnly: true }
          startupProbe:
