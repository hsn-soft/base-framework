apiVersion: v1
kind: Namespace
metadata:
  name: ns-hhs-prod-apps

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hhs-service-text-normalizer-deployment
  namespace: ns-hhs-prod-apps
spec:
  replicas: 3
  revisionHistoryLimit: 2 # for roll-back, default to 10 if not specified
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 50%
  selector:
    matchLabels:
      app: hhs-service-text-normalizer
  template:
    metadata:
      labels:
        app: hhs-service-text-normalizer
    spec:
      terminationGracePeriodSeconds: 90 # wait graceful termination — RabbitMQ consumer drain (up to ~30s, parallel) + publisher drain (up to ~30s) + host shutdown timeout (30s)
      securityContext:
        fsGroupChangePolicy: Always
        fsGroup: 1001
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: "kubernetes.azure.com/scalesetpriority"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
        - key: "pool"
          operator: "Equal"
          value: "application"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: agentpool
                    operator: In
                    values:
                      - appspool  # Node pool select
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: hhs-service-text-normalizer
                topologyKey: kubernetes.io/hostname
      containers:
        - name: hhs-service-text-normalizer-container
          image: ${IMAGE_NAME}:${BUILD_ID}
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          env:
            - name: BUILD_NUMBER
              value: "${BUILD_ID}"
            - name: TZ
              value: "UTC"
            - name: ASPNETCORE_ENVIRONMENT
              value: "${ASPNETCORE_ENVIRONMENT}"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_SHUTDOWNTIMEOUTSECONDS
              value: "60"
            - name: PUPPETEER_PROXY_HOST
              valueFrom:
                secretKeyRef:
                  name: iproyal-proxy-secret
                  key: PROXY_HOST
            - name: PUPPETEER_PROXY_PORT
              valueFrom:
                secretKeyRef:
                  name: iproyal-proxy-secret
                  key: PROXY_PORT
            - name: PUPPETEER_PROXY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: iproyal-proxy-secret
                  key: PROXY_USERNAME
            - name: PUPPETEER_PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iproyal-proxy-secret
                  key: PROXY_PASSWORD
          ports:
            - name: http-web-app
              containerPort: 8080
              protocol: TCP
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            seccompProfile:
              type: "RuntimeDefault"   
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "preStop start";
                    sleep 10;
                    echo "preStop done";
          startupProbe:
            httpGet:
              path: /StartupCheck
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 40
            failureThreshold: 6
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /LivenessCheck
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ReadinessCheck
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5
          volumeMounts:
            - name: tmpfs-folder
              mountPath: /tmp
            - name: dev-shm
              mountPath: /dev/shm
            - name: puppeteer-config
              mountPath: /home/serviceuser/.config
      volumes:
        - name: tmpfs-folder
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: dev-shm
          emptyDir:
            medium: Memory
        - name: puppeteer-config
          emptyDir:
            medium: Memory
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hhs-service-text-normalizer-pdb
  namespace: ns-hhs-prod-apps
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hhs-service-text-normalizer
---
# https://kubernetes.io/docs/concepts/services-networking/service/#defining-a-service
kind: Service
apiVersion: v1
metadata:
  name: hhs-service-text-normalizer-svc
  namespace: ns-hhs-prod-apps
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80 # ServicePort
      targetPort: 8080 # ContainerPort
  selector:
    app: hhs-service-text-normalizer
