apiVersion: v1
kind: Namespace
metadata:
  name: ns-hhs-uat-apps

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hhs-service-content-deployment
  namespace: ns-hhs-uat-apps
spec:
  replicas: 3
  revisionHistoryLimit: 2 # for roll-back, default to 10 if not specified
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 50%
  selector:
    matchLabels:
      app: hhs-service-content
  template:
    metadata:
      labels:
        app: hhs-service-content
    spec:
      terminationGracePeriodSeconds: 10 # successfully wait termination
      securityContext:
        fsGroupChangePolicy: Always
        fsGroup: 1001
      nodeSelector:
        kubernetes.io/os: linux
      tolerations: []
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: hhs-service-content
                topologyKey: kubernetes.io/hostname
      containers:
        - name: hhs-service-content-container
          image: ${IMAGE_NAME}:${BUILD_ID}
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 400m
              memory: 1Gi
          env:
            - name: BUILD_NUMBER
              value: "${BUILD_ID}"
            - name: TZ
              value: "UTC"
            - name: ASPNETCORE_ENVIRONMENT
              value: "${ASPNETCORE_ENVIRONMENT}"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
          ports:
            - name: http-web-app
              containerPort: 8080
              protocol: TCP
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            seccompProfile:
              type: "RuntimeDefault"
          volumeMounts:
            - name: tmpfs-folder
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /StartupCheck
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 40
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /LivenessCheck
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ReadinessCheck
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5
      volumes:
        - name: tmpfs-folder
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hhs-service-content-pdb
  namespace: ns-hhs-uat-apps
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hhs-service-content
---
# https://kubernetes.io/docs/concepts/services-networking/service/#defining-a-service
kind: Service
apiVersion: v1
metadata:
  name: hhs-service-content-svc
  namespace: ns-hhs-uat-apps
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80 # ServicePort
      targetPort: 8080 # ContainerPort
  selector:
    app: hhs-service-content
