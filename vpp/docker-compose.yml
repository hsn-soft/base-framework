version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: hhs-minio
    ports:
      - "9100:9000"  # API Port (mapped from container 9000 to host 9100)
      - "9101:9001"  # Console Port (mapped from container 9001 to host 9101)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_CONSOLE_ADDRESS: ":9001"
    command: minio server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s

volumes:
  minio_data:
    driver: local
